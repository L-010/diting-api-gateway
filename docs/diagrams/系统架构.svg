<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2000" viewBox="0 0 1400 2000" role="img" aria-labelledby="title desc">
  <title id="title">地震学 API 软件管理与共享平台系统架构</title>
  <desc id="desc">面向 API 软件开发需求整理的平台网站系统架构图，包含访问入口、平台管理、API 转发、专业 API 服务、数据日志和安全运维。</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .frame { fill: none; stroke: #172033; stroke-width: 2.5; rx: 20; }
      .layer { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 16; }
      .subbox { fill: #f9fbff; stroke: #64748b; stroke-width: 1.6; rx: 12; }
      .accent-user { fill: #eef8f4; stroke: #16795b; }
      .accent-entry { fill: #eef4ff; stroke: #315ecb; }
      .accent-core { fill: #fff8ea; stroke: #b36b00; }
      .accent-proxy { fill: #eef8fb; stroke: #13748a; }
      .accent-api { fill: #f5f1ff; stroke: #6741b9; }
      .accent-data { fill: #f1f8ee; stroke: #4f8f35; }
      .accent-safe { fill: #fff1f3; stroke: #bf4154; }
      .title { font: 700 32px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .section-title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .box-title { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .text { font: 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .small { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .tag { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .badge { fill: rgba(255,255,255,0.78); stroke: rgba(100,116,139,0.35); stroke-width: 1; rx: 10; }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; }
      .arrow { stroke: #64748b; stroke-width: 2.3; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrowheadSoft); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#64748b" />
    </marker>
    <marker id="arrowheadSoft" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#94a3b8" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <clipPath id="contentClip">
      <rect x="34" y="34" width="1332" height="1932" rx="18" />
    </clipPath>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="2000" />

  <g clip-path="url(#contentClip)">
    <text class="title" x="700" y="58" text-anchor="middle">地震学 API 软件管理与共享平台系统架构</text>
    <text class="subtitle" x="700" y="88" text-anchor="middle">统一门户、统一转发、统一日志，真实专业 API 地址由管理员集中维护</text>

    <!-- 用户访问层 -->
    <g filter="url(#shadow)">
      <rect class="layer accent-user" x="120" y="125" width="1160" height="185" />
      <text class="section-title" x="700" y="166" text-anchor="middle">用户访问层 / 平台网站</text>
      <line class="divider" x1="165" y1="192" x2="1235" y2="192" />
      <text class="text" x="180" y="232">访客：浏览 API 介绍、使用手册、示例、数据例子</text>
      <text class="text" x="180" y="270">注册用户：登录后调用 API、上传数据、查看返回结果、下载文件</text>
      <text class="text" x="770" y="226">管理员：发布、安装、配置 API</text>
      <text class="text" x="770" y="258">维护虚拟 API 与实际 API 的对应关系</text>
      <text class="text" x="770" y="290">平台界面：API 目录、调用记录、结果预览、统计图表</text>
    </g>

    <path class="arrow" d="M700 310 L700 360" />

    <!-- 统一入口层 -->
    <g filter="url(#shadow)">
      <rect class="layer accent-entry" x="120" y="360" width="1160" height="175" />
      <text class="section-title" x="700" y="402" text-anchor="middle">统一入口与访问控制</text>
      <rect class="badge" x="1040" y="378" width="150" height="34" />
      <text class="tag" x="1115" y="401" text-anchor="middle">平台统一 IP/API</text>
      <line class="divider" x1="165" y1="426" x2="1235" y2="426" />
      <text class="text" x="180" y="469">Web 网关：HTTPS、登录态、静态页面、接口文档</text>
      <text class="text" x="180" y="505">API 网关：认证鉴权、API Key、调用限额、版本控制、请求审计</text>
      <text class="text" x="735" y="469">转发原则：用户只访问平台地址</text>
      <text class="text" x="735" y="505">真实 API 服务器地址不直接公开，由管理员统一对接</text>
    </g>

    <path class="arrow" d="M700 535 L700 585" />

    <!-- 平台管理核心层 -->
    <g filter="url(#shadow)">
      <rect class="layer accent-core" x="120" y="585" width="1160" height="265" />
      <text class="section-title" x="700" y="628" text-anchor="middle">平台管理核心层</text>
      <rect class="badge" x="1040" y="603" width="150" height="34" />
      <text class="tag" x="1115" y="626" text-anchor="middle">网站业务中心</text>
      <line class="divider" x1="165" y1="652" x2="1235" y2="652" />
      <text class="text" x="180" y="695">1. 用户注册、登录、角色、API Key 管理</text>
      <text class="text" x="180" y="735">2. API 目录、介绍页、使用手册、示例与数据例子管理</text>
      <text class="text" x="180" y="775">3. 上传数据、参数文件、模型文件，并统一返回结果文件</text>
      <text class="text" x="710" y="695">4. 调用记录：次数、计算量、计算时间、API 服务</text>
      <text class="text" x="710" y="735">5. 日志与统计：用户请求、上传数据、结果返回、错误信息</text>
      <text class="text" x="710" y="775">6. 管理后台：API 发布、安装状态、接口配置、可见范围</text>
      <text class="small" x="700" y="820" text-anchor="middle">说明：本层聚焦平台管理、参数校验、调用记录、结果返回和统一转发。</text>
    </g>

    <path class="arrow" d="M420 850 L420 905" />
    <path class="arrow" d="M980 850 L980 905" />

    <!-- 管理配置与转发适配层 -->
    <g filter="url(#shadow)">
      <rect class="subbox accent-proxy" x="120" y="905" width="535" height="270" />
      <text class="section-title" x="388" y="949" text-anchor="middle">管理员 API 配置</text>
      <line class="divider" x1="160" y1="972" x2="615" y2="972" />
      <text class="text" x="170" y="1015">虚拟 API：平台公开路径和说明</text>
      <text class="text" x="170" y="1055">实际 API：其它服务器真实接口地址</text>
      <text class="text" x="170" y="1095">配置项：密钥、参数模板、文件字段、返回格式</text>
      <text class="text" x="170" y="1135">管理项：上线下线、分类、权限、接口文档</text>
    </g>

    <g filter="url(#shadow)">
      <rect class="subbox accent-proxy" x="745" y="905" width="535" height="270" />
      <text class="section-title" x="1013" y="949" text-anchor="middle">API 转发与适配</text>
      <line class="divider" x1="785" y1="972" x2="1240" y2="972" />
      <text class="text" x="795" y="1015">统一转接：按虚拟 API 转到专业服务</text>
      <text class="text" x="795" y="1055">参数适配：文本数据、参数文件、模型文件</text>
      <text class="text" x="795" y="1095">结果适配：文件返回、摘要、下载链接、错误</text>
      <text class="text" x="795" y="1135">过程记录：调用人、接口、耗时、计算量</text>
    </g>

    <path class="arrow-soft" d="M655 1040 L745 1040" />
    <path class="arrow" d="M700 1175 L700 1225" />

    <!-- 专业 API 服务层 -->
    <g filter="url(#shadow)">
      <rect class="layer accent-api" x="120" y="1225" width="1160" height="290" />
      <text class="section-title" x="700" y="1267" text-anchor="middle">专业 API 服务层</text>
      <rect class="badge" x="1040" y="1242" width="150" height="34" />
      <text class="tag" x="1115" y="1265" text-anchor="middle">可部署在其它机器</text>
      <line class="divider" x1="165" y1="1292" x2="1235" y2="1292" />

      <rect class="subbox" x="165" y="1322" width="250" height="135" />
      <text class="box-title" x="290" y="1360" text-anchor="middle">噪声成像 API</text>
      <text class="small" x="190" y="1396">数据处理、成像反演</text>
      <text class="small" x="190" y="1426">可对接 MATLAB 服务</text>

      <rect class="subbox" x="440" y="1322" width="250" height="135" />
      <text class="box-title" x="565" y="1360" text-anchor="middle">震源破裂过程 API</text>
      <text class="small" x="465" y="1396">震源过程反演与分析</text>
      <text class="small" x="465" y="1426">可包含 MATLAB 计算</text>

      <rect class="subbox" x="715" y="1322" width="250" height="135" />
      <text class="box-title" x="840" y="1360" text-anchor="middle">走时成像 API</text>
      <text class="small" x="740" y="1396">文本数据、反演参数文件</text>
      <text class="small" x="740" y="1426">输入模型文件，返回结果文件</text>

      <rect class="subbox" x="990" y="1322" width="245" height="135" />
      <text class="box-title" x="1113" y="1360" text-anchor="middle">其它专业 API</text>
      <text class="small" x="1015" y="1396">后续专业模块扩展接入</text>
      <text class="small" x="1015" y="1426">统一发布、配置和审计</text>

      <text class="small" x="700" y="1490" text-anchor="middle">平台只暴露统一 API；专业 API 可按算力需求部署在不同服务器，由平台完成统一转发和记录。</text>
    </g>

    <path class="arrow" d="M700 1515 L700 1565" />

    <!-- 数据、日志和统计层 -->
    <g filter="url(#shadow)">
      <rect class="layer accent-data" x="120" y="1565" width="1160" height="190" />
      <text class="section-title" x="700" y="1607" text-anchor="middle">数据、日志与统计层</text>
      <line class="divider" x1="165" y1="1632" x2="1235" y2="1632" />
      <text class="text" x="180" y="1675">关系数据库：用户、角色、API 配置、接口目录、调用记录</text>
      <text class="text" x="180" y="1715">文件存储：上传数据、参数文件、模型文件、返回结果、下载包</text>
      <text class="text" x="735" y="1675">日志库：请求日志、转发日志、错误日志、管理员操作日志</text>
      <text class="text" x="735" y="1715">统计图：调用次数、计算量、计算时间、用户使用情况、API 热度</text>
    </g>

    <path class="arrow" d="M700 1755 L700 1805" />

    <!-- 安全与运维边界 -->
    <g filter="url(#shadow)">
      <rect class="layer accent-safe" x="120" y="1805" width="1160" height="145" />
      <text class="section-title" x="700" y="1847" text-anchor="middle">安全与运维边界</text>
      <line class="divider" x1="165" y1="1872" x2="1235" y2="1872" />
      <text class="small" x="180" y="1907">真实 API 地址隐藏、管理员统一维护、接口访问可审计</text>
      <text class="small" x="180" y="1937">上传大小与类型校验、敏感路径隔离、结果文件按用户权限访问</text>
      <text class="small" x="735" y="1907">API 调用配额、异常告警、日志留存、数据备份与过期清理</text>
      <text class="small" x="735" y="1937">支持一台平台服务器统一入口，对接多台专业 API 计算服务器</text>
    </g>
  </g>

  <rect class="frame" x="30" y="30" width="1340" height="1940" />
</svg>
