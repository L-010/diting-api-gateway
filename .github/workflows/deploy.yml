name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    name: Pre-Deploy Checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate configuration
      run: |
        echo "🔍 Validating configuration files..."
        if [ ! -f "docker-compose.prod.yml" ]; then
          echo "❌ docker-compose.prod.yml not found"
          exit 1
        fi

        if [ ! -f ".env.production.example" ]; then
          echo "❌ .env.production.example not found"
          exit 1
        fi

        echo "✅ Configuration files validated"

    - name: Check for secrets in code
      run: |
        echo "🔒 Scanning for hardcoded secrets..."
        # Create a simple Python script to check for hardcoded secrets
        python3 << 'EOF'
        import os
        import re

        # Patterns to look for: actual hardcoded values, not field definitions
        suspicious_patterns = [
            r'password\s*=\s*["\'](?![\s]*["\'])[^"\']+["\']',
            r'secret\s*=\s*["\'](?![\s]*["\'])[^"\']+["\']',
            r'api_key\s*=\s*["\'](?![\s]*["\'])[^"\']+["\']',
            r'token\s*=\s*["\'](?![\s]*["\'])[^"\']+["\']',
        ]

        exclude_dirs = {'.venv', 'node_modules', '.git', 'alembic', 'migrations', '__pycache__'}
        found_secrets = False

        for root, dirs, files in os.walk('.'):
            # Remove excluded directories from traversal
            dirs[:] = [d for d in dirs if d not in exclude_dirs]

            for file in files:
                if file.endswith(('.py', '.js', '.ts')):
                    filepath = os.path.join(root, file)
                    try:
                        with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                            for i, line in enumerate(f, 1):
                                for pattern in suspicious_patterns:
                                    if re.search(pattern, line, re.IGNORECASE):
                                        print(f"⚠️  Suspicious pattern found in {filepath}:{i}")
                                        found_secrets = True
                    except:
                        pass

        if found_secrets:
            print("❌ Hardcoded secrets detected")
            exit(1)
        else:
            print("✅ No hardcoded secrets detected")
        EOF

  build:
    needs: check
    runs-on: ubuntu-latest
    name: Build Docker Images
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      run: |
        echo "🔨 Building backend image..."
        docker build -t api-gateway-backend:${{ github.sha }} -f backend/Dockerfile backend/
        echo "✅ Backend image built"

    - name: Build frontend image
      run: |
        echo "🔨 Building frontend image..."
        docker build -t api-gateway-frontend:${{ github.sha }} -f frontend/Dockerfile frontend/
        echo "✅ Frontend image built"

    - name: Validate images
      run: |
        echo "🔍 Validating built images..."
        docker inspect api-gateway-backend:${{ github.sha }}
        docker inspect api-gateway-frontend:${{ github.sha }}
        echo "✅ Images validated"

  notify:
    needs: [check, build]
    runs-on: ubuntu-latest
    name: Notify Deployment Ready
    if: success()

    steps:
    - name: Send success notification
      run: |
        echo "✅ Build and validation passed!"
        echo "Ready for deployment"

    - name: Notify Slack (optional)
      if: vars.SLACK_WEBHOOK != ''
      run: |
        curl -X POST ${{ vars.SLACK_WEBHOOK }} \
          -H 'Content-Type: application/json' \
          -d '{
            "text": "✅ API Gateway build successful - Ready for deployment",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*API Gateway Build Status*\n✅ All checks passed\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                }
              }
            ]
          }'
